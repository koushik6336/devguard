name: DevGuard CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  DOCKERHUB_REPO: ashwadama/devguard
  AWS_REGION: us-east-1
  GREEN_INSTANCE_ID: i-0e7b9773ec9c24f40
  BLUE_INSTANCE_ID: i-0d54737f16aca8943
  TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:us-east-1:235616047376:targetgroup/devguard-tg/d99ccee03134b5f6

jobs:

  test:
    name: 'Stage 1 - Run Tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest test_app.py -v

  code_scan:
    name: 'Stage 2 - Code Scan'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker_build_scan:
    name: 'Stage 3 - Docker Build + Trivy Scan'
    runs-on: ubuntu-latest
    needs: code_scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKERHUB_REPO }}:${{ github.sha }} .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKERHUB_REPO }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

  docker_push:
    name: 'Stage 4 - Push to Docker Hub'
    runs-on: ubuntu-latest
    needs: docker_build_scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t ${{ env.DOCKERHUB_REPO }}:${{ github.sha }} -t ${{ env.DOCKERHUB_REPO }}:latest .
          docker push ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
          docker push ${{ env.DOCKERHUB_REPO }}:latest

  deploy_green:
    name: 'Stage 5 - Deploy to Green EC2'
    runs-on: ubuntu-latest
    needs: docker_push
    outputs:
      green_ip: ${{ steps.get_ip.outputs.green_ip }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Green EC2 IP
        id: get_ip
        run: |
          GREEN_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.GREEN_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "green_ip=$GREEN_IP" >> $GITHUB_OUTPUT
          echo "Green EC2 IP: $GREEN_IP"

      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > devguard-key.pem
          chmod 400 devguard-key.pem

      - name: Deploy to Green EC2
        run: |
          GREEN_IP=${{ steps.get_ip.outputs.green_ip }}
          ssh -i devguard-key.pem \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ubuntu@$GREEN_IP << EOF
            docker pull ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
            docker stop devguard-app 2>/dev/null || true
            docker rm devguard-app 2>/dev/null || true
            docker run -d \
              --name devguard-app \
              --restart always \
              -p 80:80 \
              ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
          EOF

  health_check_green:
    name: 'Stage 6 - Health Check Green EC2'
    runs-on: ubuntu-latest
    needs: deploy_green
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Green EC2 IP
        id: get_ip
        run: |
          GREEN_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.GREEN_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "green_ip=$GREEN_IP" >> $GITHUB_OUTPUT

      - name: Wait for container to start
        run: sleep 15

      - name: Health check with retries
        run: |
          GREEN_IP=${{ steps.get_ip.outputs.green_ip }}
          for i in 1 2 3; do
            echo "Health check attempt $i..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$GREEN_IP/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed - HTTP $STATUS"
            sleep 10
          done
          echo "All health checks failed"
          exit 1

  switch_alb:
    name: 'Stage 7 - Switch ALB to Green'
    runs-on: ubuntu-latest
    needs: health_check_green
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register Green EC2 in target group
        run: |
          aws elbv2 register-targets \
            --target-group-arn ${{ env.TARGET_GROUP_ARN }} \
            --targets Id=${{ env.GREEN_INSTANCE_ID }},Port=80 \
            --region ${{ env.AWS_REGION }}
          echo "Green EC2 registered"

      - name: Wait for Green to be healthy in ALB
        run: |
          for i in $(seq 1 12); do
            STATE=$(aws elbv2 describe-target-health \
              --target-group-arn ${{ env.TARGET_GROUP_ARN }} \
              --targets Id=${{ env.GREEN_INSTANCE_ID }},Port=80 \
              --region ${{ env.AWS_REGION }} \
              --query 'TargetHealthDescriptions[0].TargetHealth.State' \
              --output text)
            echo "Attempt $i - Green state: $STATE"
            if [ "$STATE" = "healthy" ]; then
              echo "Green is healthy in ALB"
              break
            fi
            sleep 10
          done

      - name: Deregister Blue EC2
        run: |
          aws elbv2 deregister-targets \
            --target-group-arn ${{ env.TARGET_GROUP_ARN }} \
            --targets Id=${{ env.BLUE_INSTANCE_ID }},Port=80 \
            --region ${{ env.AWS_REGION }}
          echo "Blue EC2 deregistered"

      - name: Wait for connection draining
        run: sleep 30

      - name: Deployment complete
        run: |
          echo "Deployment complete - Green is now LIVE"
          echo "Image: ashwadama/devguard:${{ github.sha }}"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevGuard — {% block title %}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#2d333b;
  --border:#21262d;--border2:#30363d;
  --text:#e6edf3;--text2:#8b949e;--text3:#484f58;
  --accent:#1f6feb;--accent-t:#58a6ff;
  --success:#3fb950;--warning:#e3b341;--danger:#f85149;
  --sidebar:200px;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px}

/* ── Sidebar ── */
.sidebar{width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.sb-logo{display:flex;align-items:center;gap:9px;padding:16px 14px;border-bottom:1px solid var(--border)}
.sb-icon{width:30px;height:30px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sb-name{font-size:13.5px;font-weight:600;letter-spacing:.2px}
.sb-badge{font-size:9px;background:rgba(31,111,235,.12);color:var(--accent-t);border:1px solid rgba(31,111,235,.25);border-radius:4px;padding:1px 5px;margin-left:auto}
.sb-section{padding:12px 10px 4px}
.sb-label{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:0 6px;margin-bottom:5px}
.sb-link{display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:6px;color:var(--text2);text-decoration:none;font-size:12.5px;font-weight:500;margin-bottom:2px;transition:background .12s,color .12s}
.sb-link:hover{background:var(--bg3);color:var(--text)}
.sb-link.active{background:rgba(31,111,235,.12);color:var(--accent-t)}
.sb-link svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8}
.sb-footer{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border)}
.sb-status{font-size:11px;color:var(--success);display:flex;align-items:center;gap:6px}
.sb-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block}

/* ── Main ── */
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:48px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:10px;position:sticky;top:0;z-index:50}
.topbar-path{font-size:12px;color:var(--text3);flex:1}
.topbar-path span{color:var(--text2)}
.pill{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:500}
.pill-green{background:rgba(63,185,80,.1);color:var(--success);border:1px solid rgba(63,185,80,.2)}
.pill-blue{background:rgba(31,111,235,.1);color:var(--accent-t);border:1px solid rgba(31,111,235,.2)}
.page{padding:28px 30px;flex:1}
.page-head{margin-bottom:24px}
.page-head h1{font-size:20px;font-weight:600;margin-bottom:4px}
.page-head p{font-size:12.5px;color:var(--text2)}

/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border2);border-radius:9px;padding:18px 20px}
.section-title{font-size:12.5px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
</style>
{% block style %}{% endblock %}
</head>
<body>

<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-icon">🛡️</div>
    <span class="sb-name">DevGuard</span>
    <span class="sb-badge">v1</span>
  </div>

  <div class="sb-section">
    <div class="sb-label">Main</div>
    <a href="/" class="sb-link {% if active=='home' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>Home
    </a>
    <a href="/dashboard" class="sb-link {% if active=='dashboard' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard
    </a>
    <a href="/about" class="sb-link {% if active=='about' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>About
    </a>
  </div>

  <div class="sb-section">
    <div class="sb-label">Account</div>
    <a href="/login" class="sb-link {% if active=='login' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Login
    </a>
  </div>

  <div class="sb-footer">
    <div class="sb-status">All systems operational</div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-path">DevSecOps Pipeline &rsaquo; <span>{% block breadcrumb %}{% endblock %}</span></div>
    <span class="pill pill-green">Part 1 of 4</span>
    <span class="pill pill-blue">Flask 3.0</span>
  </div>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
</div>

</body>
</html>
